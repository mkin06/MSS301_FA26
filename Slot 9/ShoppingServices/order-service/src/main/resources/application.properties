spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=${ORDER_DATABASE_URL:jdbc:mysql://localhost:3339/order_service}
spring.datasource.username=root
spring.datasource.password=mysql

# Tắt auto-create schema vì dùng Flyway
spring.jpa.hibernate.ddl-auto=none

# Port riêng vì 8080 đã dùng cho product-service
server.port=8081
inventory.url=http://localhost:8082

# TODO DOC-10: Swagger UI and OpenAPI JSON endpoints
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/api-docs
