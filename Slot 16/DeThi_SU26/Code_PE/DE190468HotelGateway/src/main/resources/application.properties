spring.application.name=DE190468HotelGateway
server.port=${SERVER_PORT:8080}
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
spring.cloud.gateway.server.webflux.default-filters[0]=DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials, RETAIN_FIRST
spring.cloud.gateway.server.webflux.routes[0].id=rooms
spring.cloud.gateway.server.webflux.routes[0].uri=${FIRST_SERVICE_URL:http://localhost:8081}
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/api/rooms,/api/rooms/**
spring.cloud.gateway.server.webflux.routes[2].id=rooms-docs
spring.cloud.gateway.server.webflux.routes[2].uri=${FIRST_SERVICE_URL:http://localhost:8081}
spring.cloud.gateway.server.webflux.routes[2].predicates[0]=Path=/openapi/rooms
spring.cloud.gateway.server.webflux.routes[2].filters[0]=SetPath=/v3/api-docs
springdoc.swagger-ui.urls[0].name=rooms-service
springdoc.swagger-ui.urls[0].url=/openapi/rooms
spring.cloud.gateway.server.webflux.routes[1].id=reservations
spring.cloud.gateway.server.webflux.routes[1].uri=${SECOND_SERVICE_URL:http://localhost:8082}
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/api/reservations,/api/reservations/**
spring.cloud.gateway.server.webflux.routes[3].id=reservations-docs
spring.cloud.gateway.server.webflux.routes[3].uri=${SECOND_SERVICE_URL:http://localhost:8082}
spring.cloud.gateway.server.webflux.routes[3].predicates[0]=Path=/openapi/reservations
spring.cloud.gateway.server.webflux.routes[3].filters[0]=SetPath=/v3/api-docs
springdoc.swagger-ui.urls[1].name=reservations-service
springdoc.swagger-ui.urls[1].url=/openapi/reservations
